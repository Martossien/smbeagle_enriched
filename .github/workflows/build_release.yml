name: Publication d'une release sur nouveau tag
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            nom: linux_amd64
          - os: ubuntu-latest
            rid: linux-arm64
            nom: linux_arm64
          - os: windows-latest
            rid: win-x64
            nom: win_x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Version depuis le tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: dotnet test SMBeagle.sln -c Release
      - name: Publier ${{ matrix.rid }}
        run: dotnet publish SMBeagle.csproj -c Release --self-contained -r ${{ matrix.rid }} -o packages/${{ matrix.rid }} -p:PublishSingleFile=true -p:PublishTrimmed=false -p:InvariantGlobalization=true -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.version }}
      - name: Archive zip
        shell: bash
        run: |
          cd packages/${{ matrix.rid }}
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path SMBeagle.exe -DestinationPath smbeagle_${{ steps.version.outputs.version }}_${{ matrix.nom }}.zip"
          else
            zip smbeagle_${{ steps.version.outputs.version }}_${{ matrix.nom }}.zip SMBeagle
          fi
      - name: Attacher à la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: packages/${{ matrix.rid }}/smbeagle_${{ steps.version.outputs.version }}_${{ matrix.nom }}.zip
